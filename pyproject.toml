[project]
name = "nextcart-agent"
version = "0.1.0"
description = "Agente de recomendación de productos complementarios (next-basket) para tienda en línea"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "polars>=1.0.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
